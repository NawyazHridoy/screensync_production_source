# ScreenSync — CI build (restored Step 0 fix)
#
# This file was missing from the shipped ZIP, so tests/run_all_tests.js
# aborted at Pass 2 ("Pass 2: .github/workflows/build.yml must exist")
# and no category test ran at all. It builds the Android app with the
# Gradle wrapper version pinned in android/gradle/wrapper/
# gradle-wrapper.properties (Gradle 8.5) and runs the JS test suite
# (package.json: "test": "node tests/run_all_tests.js").
#
# Project facts it is built on:
# - AGP 8.2.2 (android/build.gradle), Java 17 (android/app/build.gradle:
#   sourceCompatibility/targetCompatibility JavaVersion.VERSION_17)
# - Play Store flavour "playstore" (android/app/build.gradle,
#   flavorDimensions "store"), versionCode 35 / versionName "3.5.0"
#   (package.json version "3.5.0")
# - The android/ directory is committed in the repo; this workflow never
#   recreates it (no android platform re-add, no destructive cleanup).
name: ScreenSync Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Install JS dependencies
        run: npm install

      - name: Run JS test suite
        run: npm test

      - name: Build debug APK
        # gradle assembleDebug
        run: gradle assembleDebug
        working-directory: android

      - name: Build Play Store debug APK
        run: gradle assemblePlaystoreDebug
        working-directory: android

      - name: Build Play Store release bundle
        run: gradle bundlePlaystoreRelease
        working-directory: android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenSync-Debug-APK
          path: android/app/build/outputs/apk/**/debug/*.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: ScreenSync-PlayStore-AAB
          path: android/app/build/outputs/bundle/playstoreRelease/*.aab
