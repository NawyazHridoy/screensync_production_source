<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScreenSync Extension Options</title>
  <style>
    :root {
      --bg: #0c1311;
      --card: #15221e;
      --border: rgba(52, 211, 153, 0.25);
      --emerald: #10B981;
      --text: #F5F5F4;
      --muted: #A8A29E;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; margin-bottom: 6px; }
    p { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #09100e;
      color: var(--text);
      font-size: 13px;
      margin-bottom: 14px;
    }
    button {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: var(--emerald);
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }
    .status { font-size: 12px; color: #34D399; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ScreenSync MV3 Companion Settings</h1>
    <p>Configure your local desktop companion bridge endpoint and inspect your cryptographic installation handshake token.</p>
    <label for="inputSyncEndpoint">Sync Server / Companion Endpoint</label>
    <input id="inputSyncEndpoint" type="url" value="http://127.0.0.1:3001/api/v1/extension/events" />
    <label for="inputBridgeToken">Per-Installation Bridge Token (Read-Only)</label>
    <input id="inputBridgeToken" type="text" readonly />
    <button type="button" id="btnSaveOptions">Save Settings</button>
    <div class="status" id="optionsSaveStatus"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
